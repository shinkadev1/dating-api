# Шлюз для Studio: /storage/v1/* уходит в storage-api, как в Kong официального Supabase.
# Снаружи не публикуется, порт 8000 слушает только сеть Compose.
server {
    listen 8000;
    server_name _;

    # Адрес storage берётся при запросе: nginx стартует, даже если storage ещё не резолвится.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $storage_upstream http://storage:5000;

    client_max_body_size 110m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /storage/v1/ {
        rewrite ^/storage/v1/(.*)$ /$1 break;
        proxy_pass $storage_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
