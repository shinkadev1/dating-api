name: Daily report

on:
  schedule:
    - cron: "0 8 * * *" # 11:00 по Москве: отчёт за вчера
  workflow_dispatch:
    inputs:
      day:
        description: "День YYYY-MM-DD (пусто — вчера по Москве)"
        required: false
        default: ""

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run report on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DAY: ${{ inputs.day }}
        run: |
          set -euo pipefail
          if [ -n "$DAY" ] && ! [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "day must be YYYY-MM-DD" >&2; exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Без DEPLOY_PATH — $HOME/dating-bot (раскрывается на сервере), как в server-logs.yml
          REMOTE_DIR="${DEPLOY_PATH:-\$HOME/dating-bot}"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
              -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "APP_DIR=\"$REMOTE_DIR\" bash -s -- $DAY" \
              < deploy/daily-report.sh | tee report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm -f ~/.ssh/deploy_key
          sed -n '/^TG_REPORT_BEGIN$/,/^TG_REPORT_END$/{//!p}' report.txt > tg-message.txt
          test -s tg-message.txt || { echo "TG message is empty" >&2; exit 1; }

      - name: Send to Telegram
        env:
          TG_TOKEN: ${{ secrets.REPORT_TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.REPORT_TG_CHAT_ID }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage"             --data-urlencode "chat_id=${TG_CHAT}"             --data-urlencode "text@tg-message.txt" -o /dev/null
          echo "Отправлено"

      - name: Notify about failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.REPORT_TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.REPORT_TG_CHAT_ID }}
          DAY: ${{ inputs.day }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          D="${DAY:-$(TZ=Europe/Moscow date -d yesterday +%Y-%m-%d)}"
          D="$(date -d "$D" +%d.%m.%Y)"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage"             --data-urlencode "chat_id=${TG_CHAT}"             --data-urlencode "text=⚠ Отчёт за ${D} не собран, см. ${RUN_URL}" -o /dev/null || true
