name: Daily report

on:
  schedule:
    - cron: "5 21 * * *" # 00:05 по Москве: отчёт за прошедшие сутки
  workflow_dispatch:
    inputs:
      day:
        description: "День YYYY-MM-DD (пусто — вчера по Москве)"
        required: false
        default: ""

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run report on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DAY: ${{ inputs.day }}
        run: |
          set -euo pipefail
          if [ -n "$DAY" ] && ! [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "day must be YYYY-MM-DD" >&2; exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Без DEPLOY_PATH — $HOME/dating-bot (раскрывается на сервере), как в server-logs.yml
          REMOTE_DIR="${DEPLOY_PATH:-\$HOME/dating-bot}"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
              -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "APP_DIR=\"$REMOTE_DIR\" bash -s -- $DAY" \
              < deploy/daily-report.sh | tee report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm -f ~/.ssh/deploy_key
