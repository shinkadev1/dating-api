name: Storage diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only Beget/rclone diagnostics
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 12m
          envs: DEPLOY_PATH
          script: |
            set -u
            APP_DIR="${DEPLOY_PATH:-$HOME/dating-bot}"
            cd "$APP_DIR"
            val() { grep -E "^$1=" .env | tail -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"; }
            EP=$(val S3_ENDPOINT_URL); RG=$(val S3_REGION); BK=$(val S3_BUCKET)
            echo "endpoint=$EP region=$RG bucket_len=${#BK} ak_len=$(val S3_ACCESS_KEY | wc -c) sk_len=$(val S3_SECRET_KEY | wc -c)"
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' | grep -E "vk-|storage" || true
            docker exec vk-chat-api sh -c 'echo chat-api endpoint=$S3_ENDPOINT_URL region=$S3_REGION' || true
            docker logs vk-chat-api 2>&1 | grep -i "S3\|бакет" | tail -5 || true
            df -h / /var/lib/docker 2>/dev/null || true
            RC="docker run --rm -e RCLONE_CONFIG_SRC_TYPE=s3 -e RCLONE_CONFIG_SRC_PROVIDER=Other -e RCLONE_CONFIG_SRC_ENDPOINT=$EP -e RCLONE_CONFIG_SRC_REGION=$RG -e RCLONE_CONFIG_SRC_ACCESS_KEY_ID=$(val S3_ACCESS_KEY) -e RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY=$(val S3_SECRET_KEY) rclone/rclone:1.69.1"
            FL="--contimeout 10s --timeout 30s --low-level-retries 1 --retries 1"
            red() { grep -viE "secret|access_key|authorization|signature|credential" | cut -c1-300 | tail -${1:-40}; }
            echo '--- lsd src: (list buckets) ---'
            timeout 90 $RC lsd src: $FL -vv 2>&1 | red 40; echo "rc=$?"
            echo '--- lsf src:bucket max-depth 1 ---'
            timeout 90 $RC lsf "src:$BK" --max-depth 1 $FL -vv 2>&1 | red 40
            echo '--- lsf top-level dirs, recursive count with 5 min cap ---'
            timeout 300 $RC size --json "src:$BK" $FL --fast-list 2>&1 | red 20; echo "size rc=${PIPESTATUS[0]:-?}"
            echo '--- same with path style forced ---'
            timeout 90 $RC lsf "src:$BK" --max-depth 1 $FL --s3-force-path-style=true 2>&1 | red 10
