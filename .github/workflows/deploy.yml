name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - .github/workflows/deploy.yml
      - .github/workflows/server-logs.yml

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "Добавьте секрет $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Image names
        id: images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          user=$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
          echo "chat_api_image=${user}/dating-chat-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "engine_bridge_image=${user}/dating-engine-bridge:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Push chat API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: chat_api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.images.outputs.chat_api_image }}
          cache-from: type=gha,scope=chat-api
          cache-to: type=gha,scope=chat-api,mode=max

      - name: Push engine bridge image
        uses: docker/build-push-action@v6
        with:
          context: ./engine_bridge
          push: true
          platforms: linux/amd64
          tags: ${{ steps.images.outputs.engine_bridge_image }}
          cache-from: type=gha,scope=engine-bridge
          cache-to: type=gha,scope=engine-bridge,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Encode env file
        id: envfile
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          b64=$(printf '%s' "$ENV_FILE" | base64 -w 0)
          echo "::add-mask::$b64"
          echo "b64=$b64" >> "$GITHUB_OUTPUT"

      - name: Update containers from Docker Hub
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_FILE_B64: ${{ steps.envfile.outputs.b64 }}
          GIT_SHA: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CHAT_API_APP_TOKEN: ${{ secrets.CHAT_API_APP_TOKEN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CHAT_API_TG_TOKEN: ${{ secrets.CHAT_API_TG_TOKEN }}
          CHAT_ENGINE_TOKEN: ${{ secrets.CHAT_ENGINE_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          envs: DEPLOY_PATH,ENV_FILE_B64,GIT_SHA,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,CHAT_API_APP_TOKEN,CLOUDFLARE_TUNNEL_TOKEN,CHAT_API_TG_TOKEN,CHAT_ENGINE_TOKEN
          script: |
            set -eu
            if [ -n "${DEPLOY_PATH:-}" ]; then
              APP_DIR="$DEPLOY_PATH"
            else
              APP_DIR="${HOME}/dating-bot"
            fi
            hub_user=$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
            export CHAT_API_IMAGE="${hub_user}/dating-chat-api:${GIT_SHA}"
            export ENGINE_BRIDGE_IMAGE="${hub_user}/dating-engine-bridge:${GIT_SHA}"
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$(dirname "$APP_DIR")"
              git clone https://github.com/aStormspirit/dating-api.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git remote set-url origin https://github.com/aStormspirit/dating-api.git
            git fetch origin "$GIT_SHA"
            git checkout --detach --force "$GIT_SHA"
            sh deploy/update.sh
