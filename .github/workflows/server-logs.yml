name: Server logs

# Одноразово: снять премиум и пробный с VK-аккаунта владельца (по просьбе пользователя 2026-11-10, второй раз),
# чтобы заново проверить покупку. Ветка diag/premium-reset, в master не вливается.

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Reset owner test premium
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: DEPLOY_PATH
          script: |
            set -eu
            cat > /tmp/premium-reset.sql <<'SQL'
            \set ON_ERROR_STOP on
            BEGIN;
            CREATE TEMP TABLE acc ON COMMIT DROP AS
              SELECT DISTINCT account_id id FROM premium_identities WHERE platform='vk' AND user_id=208891943;
            SELECT 'orders' t, left(o.id::text,8) o, o.plan_id, o.amount_rub, o.status, o.provider_status, o.created_at FROM premium_orders o JOIN acc ON acc.id=o.account_id ORDER BY o.created_at DESC LIMIT 10;
            CREATE TEMP TABLE bu ON COMMIT DROP AS
              SELECT i.platform, i.user_id FROM premium_identities i JOIN acc ON acc.id=i.account_id
              UNION SELECT 'vk', 208891943;
            SELECT 'accounts' what, count(*) FROM acc;
            SELECT 'before' t, platform||':'||right(user_id::text,4) u, is_premium, premium_until FROM bot_users WHERE (platform,user_id) IN (SELECT platform,user_id FROM bu);
            UPDATE premium_accounts SET premium_until=NULL, trial_used=FALSE WHERE id IN (SELECT id FROM acc);
            UPDATE premium_subscriptions SET auto_renew=FALSE, method_id=NULL, period_end=NULL, trial_used=FALSE WHERE account_id IN (SELECT id FROM acc);
            -- дата в прошлом, а не NULL: 002_premium_grant.sql при старте выдаёт 30 дней строкам с NULL
            UPDATE bot_users SET is_premium=FALSE, premium_until=NOW()-INTERVAL '1 minute', updated_at=NOW()
              WHERE (platform,user_id) IN (SELECT platform,user_id FROM bu);
            SELECT 'after' t, platform||':'||right(user_id::text,4) u, is_premium, premium_until, premium_until>NOW() active FROM bot_users WHERE (platform,user_id) IN (SELECT platform,user_id FROM bu);
            SELECT 'accounts after' t, premium_until, trial_used FROM premium_accounts WHERE id IN (SELECT id FROM acc);
            COMMIT;
            SELECT 'still active vk/tg' t, platform||':'||right(user_id::text,4) u, premium_until FROM bot_users WHERE premium_until>NOW();
            SQL
            docker exec -i vk-bot-db psql -U supabase_admin -h localhost < /tmp/premium-reset.sql
            rm -f /tmp/premium-reset.sql
