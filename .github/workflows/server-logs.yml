name: Server logs

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Read bot container logs
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: DEPLOY_PATH
          script: |
            set -eu
            if [ -n "${DEPLOY_PATH:-}" ]; then
              APP_DIR="$DEPLOY_PATH"
            else
              APP_DIR="${HOME}/dating-bot"
            fi
            cd "$APP_DIR"
            echo '--- TOKENS ---'
            awk -F= '
              /^CHAT_API_APP_TOKEN=/ { print "CHAT_API_APP_TOKEN", (length($2) > 0 ? "set" : "empty") }
              /^CLOUDFLARE_TUNNEL_TOKEN=/ { print "CLOUDFLARE_TUNNEL_TOKEN length", length($0) - length("CLOUDFLARE_TUNNEL_TOKEN=") }
            ' .env
            docker ps -a --filter name=vk- --format 'table {{.Names}}\t{{.Status}}'
            echo '--- CLOUDFLARED ---'
            docker logs vk-bot-cloudflared --tail 60 2>&1 || true
            echo '--- CHAT API ---'
            docker logs vk-chat-api --tail 60 2>&1 || true
            echo '--- ENGINE BRIDGE ---'
            docker logs vk-engine-bridge --tail 80 2>&1 || true
            echo '--- ENGINE BRIDGE NETWORK ---'
            docker exec vk-engine-bridge python -c 'import socket; print("DNS", socket.getaddrinfo("bots.chatwithyou.site", 443, type=socket.SOCK_STREAM)[0][4][0])' 2>&1 || true
            docker exec vk-engine-bridge python -c 'import httpx; r=httpx.get("https://bots.chatwithyou.site/health", timeout=10); print("HTTPS", r.status_code)' 2>&1 || true
            echo '--- CLOUDFLARE IP ROUTES ---'
            docker exec vk-engine-bridge python -c '
            import socket, ssl
            host = "bots.chatwithyou.site"
            ips = sorted({item[4][0] for item in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)} | {"188.114.97.7", "188.114.96.7"})
            for ip in ips:
                try:
                    with socket.create_connection((ip, 443), timeout=5) as raw:
                        with ssl.create_default_context().wrap_socket(raw, server_hostname=host):
                            print(ip, "TLS OK", flush=True)
                except Exception as exc:
                    print(ip, type(exc).__name__, str(exc), flush=True)
            ' 2>&1 || true
            echo '--- OTHER HTTPS ROUTES ---'
            docker exec vk-engine-bridge python -c 'import httpx; r=httpx.get("https://api.github.com", timeout=10); print("CONTAINER GITHUB", r.status_code)' 2>&1 || true
            curl -sS -o /dev/null -w 'HOST ENGINE %{http_code}\n' --max-time 10 https://bots.chatwithyou.site/health 2>&1 || true
            curl -sS -o /dev/null -w 'HOST GITHUB %{http_code}\n' --max-time 10 https://api.github.com 2>&1 || true
            docker exec vk-engine-bridge python -c 'import httpx; r=httpx.get("https://www.cloudflare.com", timeout=10); print("CONTAINER CLOUDFLARE", r.status_code)' 2>&1 || true
            curl -sS -o /dev/null -w 'HOST CLOUDFLARE %{http_code}\n' --max-time 10 https://www.cloudflare.com 2>&1 || true
            echo '--- HOST VERSUS CONTAINER ---'
            getent ahostsv4 bots.chatwithyou.site | head -n 2 || true
            curl -sS -o /dev/null -w 'HOST ENGINE %{http_code} IP %{remote_ip}\n' --max-time 10 https://bots.chatwithyou.site/health 2>&1 || true
            docker exec vk-engine-bridge python -c 'import os; print("CONTAINER PROXY VARS", sorted(k for k in os.environ if "proxy" in k.lower()))' 2>&1 || true
            python3 -c 'import os; print("HOST PROXY VARS", sorted(k for k in os.environ if "proxy" in k.lower()))' 2>&1 || true
            echo '--- TCP MSS PROBE ---'
            docker exec vk-engine-bridge python -c '
            import socket, ssl
            host = "bots.chatwithyou.site"
            ip = "172.67.216.125"
            for mss in (1200, 1000):
                raw = socket.socket()
                raw.settimeout(8)
                try:
                    raw.setsockopt(socket.IPPROTO_TCP, socket.TCP_MAXSEG, mss)
                    raw.connect((ip, 443))
                    with ssl.create_default_context().wrap_socket(raw, server_hostname=host) as secure:
                        print("MSS", mss, "TLS", secure.version(), flush=True)
                except Exception as exc:
                    print("MSS", mss, type(exc).__name__, str(exc), flush=True)
                finally:
                    raw.close()
            ' 2>&1 || true
            echo '--- LOGS ---'
            docker logs vk-bot --tail 200 2>&1 || true

  telegram-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          TG_DEPLOY_HOST: ${{ secrets.TG_DEPLOY_HOST }}
          TG_DEPLOY_USER: ${{ secrets.TG_DEPLOY_USER }}
          TG_DEPLOY_SSH_KEY: ${{ secrets.TG_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$TG_DEPLOY_HOST" ] || [ -z "$TG_DEPLOY_USER" ] || [ -z "$TG_DEPLOY_SSH_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Telegram bot logs
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.TG_DEPLOY_HOST }}
          username: ${{ secrets.TG_DEPLOY_USER }}
          key: ${{ secrets.TG_DEPLOY_SSH_KEY }}
          port: ${{ secrets.TG_DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -eu
            docker ps -a --filter name=dating-tg-bot --format 'table {{.Names}}\t{{.Status}}'
            echo '--- TG BOT ---'
            docker logs dating-tg-bot --tail 200 2>&1 || true
