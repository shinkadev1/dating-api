name: Server logs

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Read bot container logs
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: DEPLOY_PATH
          script: |
            set -eu
            if [ -n "${DEPLOY_PATH:-}" ]; then
              APP_DIR="$DEPLOY_PATH"
            else
              APP_DIR="${HOME}/dating-bot"
            fi
            cd "$APP_DIR"
            echo '--- TOKENS ---'
            awk -F= '
              /^CHAT_API_APP_TOKEN=/ { print "CHAT_API_APP_TOKEN", (length($2) > 0 ? "set" : "empty") }
              /^CLOUDFLARE_TUNNEL_TOKEN=/ { print "CLOUDFLARE_TUNNEL_TOKEN length", length($0) - length("CLOUDFLARE_TUNNEL_TOKEN=") }
            ' .env
            docker ps -a --filter name=vk- --format 'table {{.Names}}\t{{.Status}}'
            echo '--- CLOUDFLARED ---'
            docker logs vk-bot-cloudflared --tail 60 2>&1 || true
            echo '--- CHAT API ---'
            docker logs vk-chat-api --tail 60 2>&1 || true
            echo '--- ENGINE BRIDGE ---'
            docker logs vk-engine-bridge --tail 80 2>&1 || true
            echo '--- LOGS ---'
            docker logs vk-bot --tail 200 2>&1 || true
            echo '--- PREMIUM WEB ---'
            docker logs vk-premium-web --tail 80 2>&1 | grep -v 'GET /health' || true
            echo '--- PREMIUM SCHEDULER ---'
            docker logs vk-premium-scheduler --tail 80 2>&1 || true
            echo '--- PREMIUM STATE (read-only, no emails or full ids) ---'
            docker exec vk-bot-db psql -U supabase_admin -h localhost -v ON_ERROR_STOP=0 -c "
              SELECT left(o.id::text,8) id, o.plan_id, o.status, o.provider_status, o.payment_id IS NOT NULL has_payment,
                     o.created_at, o.applied_at, a.premium_until, a.email IS NOT NULL has_email,
                     (SELECT string_agg(i.platform||':'||right(i.user_id::text,4),',') FROM premium_identities i WHERE i.account_id=o.account_id) identities,
                     (SELECT string_agg(b.platform||':'||right(b.user_id::text,4)||'='||coalesce(b.premium_until::text,'null'),',') FROM premium_identities i JOIN bot_users b ON b.platform=i.platform AND b.user_id=i.user_id WHERE i.account_id=o.account_id) bot_users
              FROM premium_orders o LEFT JOIN premium_accounts a ON a.id=o.account_id ORDER BY o.created_at DESC LIMIT 8;" 2>&1 || true
            docker exec vk-bot-db psql -U supabase_admin -h localhost -c "SELECT id, renewal, created_at, sent_at FROM premium_notices ORDER BY id DESC LIMIT 5" 2>&1 || true
            docker exec vk-premium-scheduler python -c "import redis,os;print('redis ping',redis.Redis.from_url(os.environ['REDIS_URL']).ping())" 2>&1 | tail -2 || true

  telegram-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          TG_DEPLOY_HOST: ${{ secrets.TG_DEPLOY_HOST }}
          TG_DEPLOY_USER: ${{ secrets.TG_DEPLOY_USER }}
          TG_DEPLOY_SSH_KEY: ${{ secrets.TG_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$TG_DEPLOY_HOST" ] || [ -z "$TG_DEPLOY_USER" ] || [ -z "$TG_DEPLOY_SSH_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Telegram bot logs
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.TG_DEPLOY_HOST }}
          username: ${{ secrets.TG_DEPLOY_USER }}
          key: ${{ secrets.TG_DEPLOY_SSH_KEY }}
          port: ${{ secrets.TG_DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -eu
            docker ps -a --filter name=dating-tg-bot --format 'table {{.Names}}\t{{.Status}}'
            echo '--- TG BOT ---'
            docker logs dating-tg-bot --tail 200 2>&1 || true
