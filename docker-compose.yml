# Chat API, Supabase Storage (медиа), мост к chat-engine, Redis, база Supabase Postgres и панель Studio.
# Бот ВК — репозиторий dating-bot-vk, бот Telegram — dating-bot-tg.
# Локально: docker compose up --build
# Локально мост: COMPOSE_PROFILES=engine docker compose up --build
# На сервере CI подставляет образы из Docker Hub, сборки нет.
# Chat API: http://127.0.0.1:8000/docs
# На сервере Studio и Chat API открыты наружу только через cloudflared (профиль proxy).
# Studio: http://127.0.0.1:54323

services:
  db:
    image: supabase/postgres:17.6.1.136
    container_name: vk-bot-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    volumes:
      - supabase_data:/var/lib/postgresql/data
      - ./supabase/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U supabase_admin -h localhost -d $$POSTGRES_DB -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: vk-bot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  chat-api:
    image: ${CHAT_API_IMAGE:-dating-chat-api:local}
    build:
      context: .
      dockerfile: chat_api/Dockerfile
    container_name: vk-chat-api
    restart: unless-stopped
    ports:
      - "${CHAT_API_PUBLISH:-127.0.0.1:8000}:8000"
    environment:
      DATABASE_URL: postgresql://supabase_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://redis:6379/0
      CHAT_API_SERVICE_TOKEN: ${CHAT_API_SERVICE_TOKEN:?Задайте CHAT_API_SERVICE_TOKEN в .env}
      CHAT_API_APP_TOKEN: ${CHAT_API_APP_TOKEN:?Задайте CHAT_API_APP_TOKEN в .env}
      # Без токена engine_bridge люди ищут только друг друга.
      CHAT_API_ENGINE_TOKEN: ${CHAT_API_ENGINE_TOKEN:-}
      # Бот Telegram работает на сервере chat-engine и ходит сюда через Cloudflare Access.
      CHAT_API_TG_TOKEN: ${CHAT_API_TG_TOKEN:-}
      ENGINE_FALLBACK_AFTER_SECONDS: ${ENGINE_FALLBACK_AFTER_SECONDS:-0}
      STATS_ONLINE_WINDOW_SECONDS: ${STATS_ONLINE_WINDOW_SECONDS:-300}
      # Медиа лежат в Supabase Storage (S3-протокол, бакет chat-media). Другое S3-хранилище можно задать MEDIA_S3_* в .env сервера.
      S3_ENDPOINT_URL: ${MEDIA_S3_ENDPOINT_URL:-http://storage:5000/s3}
      S3_REGION: ${MEDIA_S3_REGION:-local}
      S3_BUCKET: ${MEDIA_S3_BUCKET:-chat-media}
      S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-${STORAGE_S3_ACCESS_KEY_ID:-}}
      S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-${STORAGE_S3_SECRET_KEY:-}}
      # Подпись ссылок на оплату премиума; тот же секрет у premium_site. Без него /premium/link — 503.
      PREMIUM_LINK_SECRET: ${PREMIUM_LINK_SECRET:-}
      PAY_PUBLIC_URL: ${PAY_PUBLIC_URL:-https://pay.chatwithyou.site}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Собеседники из chat-engine (bots.chatwithyou.site), когда живых в очереди нет. Профиль engine.
  engine-bridge:
    image: ${ENGINE_BRIDGE_IMAGE:-dating-engine-bridge:local}
    build: ./engine_bridge
    container_name: vk-engine-bridge
    profiles: ["engine"]
    restart: unless-stopped
    environment:
      CHAT_API_URL: http://chat-api:8000
      CHAT_API_ENGINE_TOKEN: ${CHAT_API_ENGINE_TOKEN:-}
      CHAT_ENGINE_URL: ${CHAT_ENGINE_URL:-https://bots.chatwithyou.site}
      CHAT_ENGINE_TOKEN: ${CHAT_ENGINE_TOKEN:-}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      chat-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Supabase Storage: S3-протокол для Chat API и файлы в Studio → Storage. Файловый бэкенд на томе storage_data.
  # Порты наружу не публикуются. Версия — из docker/docker-compose.yml supabase/supabase на ревизии со studio 2026.09.07.
  storage:
    image: supabase/storage-api:v1.74.0
    container_name: vk-bot-storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://supabase_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}
      AUTH_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.E-Wb32WyzBQ0NvSFSxaabhK1opQeq65vpU0GnB6eRBU}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.FVfA9iTl8yqxjiLCA6orZ_LpnyFfXdRkNfamr2WGLXs}
      # PostgREST в стеке нет: адрес нужен только для проверки конфигурации, запросов к нему Chat API и Studio не делают.
      POSTGREST_URL: http://127.0.0.1:3000
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: 115343360
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${STORAGE_S3_SECRET_KEY:-}
    volumes:
      - storage_data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Шлюз /storage/v1/* → storage:5000 для Studio (в роли Kong из официального Supabase).
  storage-gw:
    image: nginx:1.27-alpine
    container_name: vk-bot-storage-gw
    restart: unless-stopped
    depends_on:
      storage:
        condition: service_healthy
    volumes:
      - ./supabase/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Создание бакета в Supabase Storage (dst) через rclone. deploy/update.sh запускает его сам; старые медиа из Beget не переносятся.
  # Локально бакет создаётся так: docker compose --profile migrate run --rm media-migrate mkdir dst:chat-media
  media-migrate:
    image: rclone/rclone:1.69.1
    profiles: ["migrate"]
    depends_on:
      storage:
        condition: service_healthy
    environment:
      RCLONE_CONFIG_DST_TYPE: s3
      RCLONE_CONFIG_DST_PROVIDER: Other
      RCLONE_CONFIG_DST_ENDPOINT: http://storage:5000/s3
      RCLONE_CONFIG_DST_REGION: local
      RCLONE_CONFIG_DST_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_DST_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_DST_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_KEY:-}

  meta:
    image: supabase/postgres-meta:v0.99.0
    container_name: vk-bot-meta
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-local-studio-crypto-key-32-characters}

  studio:
    image: supabase/studio:2026.09.07-sha-7996410
    container_name: vk-bot-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:54323:3000"
    depends_on:
      meta:
        condition: service_started
      storage-gw:
        condition: service_started
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER_READ_WRITE: supabase_admin
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-local-studio-crypto-key-32-characters}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-VK Bot}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-vk-bot}
      # Storage API Studio видит через внутренний шлюз (/storage/v1/*), публичный адрес не меняется.
      SUPABASE_URL: http://storage-gw:8000
      SUPABASE_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-http://127.0.0.1:54323}
      SUPABASE_ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.E-Wb32WyzBQ0NvSFSxaabhK1opQeq65vpU0GnB6eRBU}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.FVfA9iTl8yqxjiLCA6orZ_LpnyFfXdRkNfamr2WGLXs}
      AUTH_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
    volumes:
      - ./supabase/studio/snippets:/app/snippets
      - ./supabase/studio/functions:/app/edge-functions:ro

  # Studio и Chat API доступны снаружи только через Cloudflare Tunnel под Cloudflare Access.
  # Адреса и правила входа настроены в Cloudflare, контейнеру нужен только токен туннеля.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    container_name: vk-bot-cloudflared
    profiles: ["proxy"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - studio
      - chat-api

volumes:
  supabase_data:
  redis_data:
  storage_data:
